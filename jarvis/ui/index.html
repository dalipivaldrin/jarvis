<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --c: 0, 216, 255;          /* Hauptfarbe Cyan */
    --amber: 255, 176, 0;
    --bg: #02060c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: rgb(var(--c)); overflow: hidden;
    font-family: "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em; user-select: none; }
  body::before { /* feines Raster */
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(var(--c), .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--c), .045) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at 50% 41%, black 20%, transparent 75%);
  }
  body::after { /* Scanlines + Vignette */
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
      radial-gradient(circle at 50% 41%, transparent 40%, rgba(0,0,0,.75) 100%);
  }
  canvas#hud { position: fixed; inset: 0; width: 100%; height: 100%; }

  .bar { position: fixed; left: 24px; right: 24px; display: flex; justify-content: space-between;
    align-items: center; font-size: 12px; z-index: 2; }
  .top { top: 18px; }
  .title { font-size: 15px; font-weight: 600; letter-spacing: .35em; text-shadow: 0 0 12px rgba(var(--c), .8); }
  .dim { opacity: .55; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px;
    background: rgb(var(--c)); box-shadow: 0 0 10px rgb(var(--c)); animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .panel { position: fixed; top: 70px; width: 210px; font-size: 11px; line-height: 1.9; z-index: 2;
    padding: 12px 14px; border: 1px solid rgba(var(--c), .25);
    background: linear-gradient(180deg, rgba(var(--c), .06), rgba(var(--c), .01));
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
  .panel.left { left: 24px; } .panel.right { right: 24px; }
  .panel h3 { font-size: 10px; font-weight: 400; letter-spacing: .3em; opacity: .6; margin-bottom: 6px; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .row b { font-weight: 500; color: #bff3ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .big { font-size: 30px; letter-spacing: .06em; color: #dff9ff; text-shadow: 0 0 14px rgba(var(--c), .7); }
  #log { margin-top: 10px; font-size: 10px; opacity: .75; min-height: 60px; }
  #log div { animation: fadein .3s; } @keyframes fadein { from { opacity: 0; transform: translateX(6px); } }

  #state { position: fixed; left: 50%; transform: translateX(-50%); top: calc(41% + min(26.5vh, 26.5vw) * 1.2 + 4px);
    font-size: 12px; letter-spacing: .5em; z-index: 2; text-shadow: 0 0 10px rgba(var(--c), .8); transition: color .3s; }

  .subs { position: fixed; left: 50%; transform: translateX(-50%); bottom: 86px; width: min(760px, 80vw);
    text-align: center; z-index: 2; }
  #you { font-size: 13px; opacity: .55; min-height: 20px; }
  #say { font-size: 17px; color: #e4fbff; line-height: 1.5; min-height: 52px; letter-spacing: .03em;
    text-shadow: 0 0 12px rgba(var(--c), .55); font-family: -apple-system, "Helvetica Neue", sans-serif; }

  .input { position: fixed; left: 50%; transform: translateX(-50%); bottom: 28px; width: min(560px, 80vw); z-index: 3;
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border: 1px solid rgba(var(--c), .35); background: rgba(2, 12, 22, .75);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
  .input span { font-size: 12px; opacity: .7; }
  .input input { flex: 1; background: transparent; border: 0; outline: 0; color: #e4fbff; font: inherit;
    font-size: 14px; letter-spacing: .04em; user-select: text; }
  .input input::placeholder { color: rgba(var(--c), .4); }
  .input:focus-within { border-color: rgba(var(--c), .8); box-shadow: 0 0 18px rgba(var(--c), .25); }
</style>
</head>
<body>
<canvas id="hud"></canvas>

<div class="bar top">
  <div class="title">J.A.R.V.I.S.</div>
  <div><span class="dot"></span><span id="online">SYSTEM ONLINE</span></div>
</div>

<div class="panel left">
  <h3>// ZEIT</h3>
  <div class="big" id="clock">00:00:00</div>
  <div id="date" class="dim">—</div>
  <h3 style="margin-top:12px">// SYSTEM</h3>
  <div class="row"><span>KERN</span><b id="core">—</b></div>
  <div class="row"><span>STIMME</span><b id="voice">—</b></div>
  <div class="row"><span>LAUFZEIT</span><b id="uptime">00:00</b></div>
</div>

<div class="panel right">
  <h3>// STATUS</h3>
  <div class="row"><span>MIKROFON</span><b id="mic">—</b></div>
  <div class="row"><span>MODUS</span><b id="mode">BEREIT</b></div>
  <div class="row"><span>SIGNAL</span><b id="sig">0 %</b></div>
  <h3 style="margin-top:12px">// AKTIVITÄT</h3>
  <div id="log"></div>
</div>

<div id="state">BEREIT</div>

<div class="subs">
  <div id="you"></div>
  <div id="say"></div>
</div>

<div class="input">
  <span>&gt;</span>
  <input id="cmd" placeholder="Befehl eingeben oder «Jarvis, …» sagen" autocomplete="off" spellcheck="false">
</div>

<script>
const HUD = (() => {
  const cv = document.getElementById("hud"), ctx = cv.getContext("2d");
  const $ = id => document.getElementById(id);
  const STATES = {
    idle:      { label: "BEREIT",       rgb: [0, 216, 255], spin: 1.0 },
    listening: { label: "HÖRT ZU",      rgb: [80, 235, 255], spin: 1.6 },
    thinking:  { label: "VERARBEITE",   rgb: [255, 176, 0], spin: 4.0 },
    speaking:  { label: "SPRICHT",      rgb: [120, 230, 255], spin: 1.8 },
    error:     { label: "FEHLER",       rgb: [255, 70, 70], spin: 0.6 },
  };
  let state = "idle", rgb = [0, 216, 255], spin = 1;
  let level = 0, target = 0, lastLevelAt = 0, t = 0, W = 0, H = 0, DPR = 1;
  const bars = new Float32Array(96), started = Date.now();
  const particles = Array.from({ length: 70 }, () => ({
    a: Math.random() * Math.PI * 2, r: 0.75 + Math.random() * 0.6, s: (Math.random() - .5) * .006, z: Math.random() }));

  function resize() {
    DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize); resize();

  const col = (a, mix = 0) => {
    const [r, g, b] = rgb.map(v => Math.round(v + (255 - v) * mix));
    return `rgba(${r},${g},${b},${a})`;
  };

  function ring(cx, cy, r, w, a, from = 0, to = Math.PI * 2) {
    ctx.beginPath(); ctx.arc(cx, cy, r, from, to); ctx.lineWidth = w; ctx.strokeStyle = col(a); ctx.stroke();
  }
  function segments(cx, cy, r, w, n, gap, rot, a, skip = []) {
    const step = Math.PI * 2 / n;
    for (let i = 0; i < n; i++) {
      if (skip.includes(i % 8)) continue;
      ring(cx, cy, r, w, a, rot + i * step + gap, rot + (i + 1) * step - gap);
    }
  }
  function ticks(cx, cy, r, n, len, rot, a, every = 5) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const ang = rot + i / n * Math.PI * 2, l = i % every === 0 ? len * 2 : len;
      ctx.moveTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
      ctx.lineTo(cx + Math.cos(ang) * (r - l), cy + Math.sin(ang) * (r - l));
    }
    ctx.lineWidth = 1; ctx.strokeStyle = col(a); ctx.stroke();
  }

  function frame() {
    t += 1 / 60;
    // Farbe & Tempo weich zum Zielzustand blenden
    const st = STATES[state];
    rgb = rgb.map((v, i) => v + (st.rgb[i] - v) * 0.08);
    spin += (st.spin - spin) * 0.05;
    // Pegel: Zielwert klingt ab, wenn keine neuen Daten kommen
    if (performance.now() - lastLevelAt > 150) target *= 0.9;
    let simulated = 0;
    if (state === "thinking") simulated = 0.25 + 0.15 * Math.sin(t * 9);
    const goal = Math.max(target, simulated);
    level += (goal - level) * (goal > level ? 0.45 : 0.12);

    const cx = W / 2, cy = H * 0.41, R = Math.min(W, H) * 0.265, L = level;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    // Kernglühen
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * (0.9 + L * 0.5));
    g.addColorStop(0, col(0.22 + L * 0.35, 0.4)); g.addColorStop(0.35, col(0.08 + L * 0.12)); g.addColorStop(1, col(0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.5, 0, Math.PI * 2); ctx.fill();

    const rot = t * 0.12 * spin;
    // äusserer Skalenring
    ticks(cx, cy, R * 1.12, 180, 5, rot * 0.3, 0.45);
    ring(cx, cy, R * 1.14, 1, 0.25);
    // segmentierter Ring (gegenläufig)
    segments(cx, cy, R * 1.03, 6, 24, 0.03, -rot * 0.8, 0.55, [3, 7]);
    // Datenbögen
    ring(cx, cy, R * 0.93, 2, 0.8, rot * 1.5, rot * 1.5 + Math.PI * (0.35 + L * 0.9));
    ring(cx, cy, R * 0.93, 2, 0.8, rot * 1.5 + Math.PI, rot * 1.5 + Math.PI * (1.35 + L * 0.9));
    ring(cx, cy, R * 0.88, 1, 0.3);

    // audio-reaktive Strahlen
    for (let i = 0; i < bars.length; i++) {
      const n = 0.5 + 0.5 * Math.sin(i * 0.9 + t * 7) * Math.sin(i * 0.37 - t * 3.3);
      const v = Math.min(1, L * (0.35 + n * 0.9) + 0.03);
      bars[i] += (v - bars[i]) * 0.35;
    }
    ctx.lineWidth = 2.2;
    for (let i = 0; i < bars.length; i++) {
      const ang = i / bars.length * Math.PI * 2 - Math.PI / 2 + rot * 0.2;
      const r0 = R * 0.62, r1 = r0 + R * 0.23 * bars[i];
      ctx.strokeStyle = col(0.35 + bars[i] * 0.65, bars[i] * 0.4);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
      ctx.lineTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
      ctx.stroke();
    }

    // innere Ringe
    ticks(cx, cy, R * 0.58, 60, 4, -rot, 0.6, 15);
    segments(cx, cy, R * 0.5, 3, 6, 0.12, rot * 2.2, 0.7);
    ring(cx, cy, R * 0.44, 1, 0.35);

    // Radar-Sweep beim Denken
    if (state === "thinking" || spin > 2) {
      const a0 = t * 4;
      const sg = ctx.createConicGradient ? ctx.createConicGradient(a0, cx, cy) : null;
      if (sg) {
        sg.addColorStop(0, col(0.35)); sg.addColorStop(0.12, col(0)); sg.addColorStop(1, col(0));
        ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(cx, cy, R * 1.02, 0, Math.PI * 2); ctx.fill();
      }
    }

    // pulsierender Kern
    const cr = R * (0.2 + L * 0.12 + 0.01 * Math.sin(t * 2));
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr * 1.6);
    cg.addColorStop(0, "rgba(255,255,255,0.95)"); cg.addColorStop(0.35, col(0.85, 0.5)); cg.addColorStop(1, col(0));
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(cx, cy, cr * 1.6, 0, Math.PI * 2); ctx.fill();
    ring(cx, cy, cr * 1.15, 1.5, 0.9);

    // Partikel im Orbit
    for (const p of particles) {
      p.a += p.s * spin + (p.s > 0 ? 1 : -1) * L * 0.01;
      const pr = R * (p.r + L * 0.15 * p.z);
      ctx.fillStyle = col(0.25 + p.z * 0.5, 0.3);
      ctx.fillRect(cx + Math.cos(p.a) * pr, cy + Math.sin(p.a) * pr, 1.5 + p.z, 1.5 + p.z);
    }

    // Fadenkreuz
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = col(0.18); ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(cx - R * 1.35, cy); ctx.lineTo(cx - R * 1.18, cy);
    ctx.moveTo(cx + R * 1.18, cy); ctx.lineTo(cx + R * 1.35, cy);
    ctx.moveTo(cx, cy - R * 1.35); ctx.lineTo(cx, cy - R * 1.18); ctx.stroke();

    $("sig").textContent = Math.round(level * 100) + " %";
    $("state").style.color = col(1, 0.2);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Uhr & Laufzeit
  const pad = n => String(n).padStart(2, "0");
  setInterval(() => {
    const d = new Date();
    $("clock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    $("date").textContent = d.toLocaleDateString("de-CH", { weekday: "long", day: "2-digit", month: "long", year: "numeric" }).toUpperCase();
    const s = Math.floor((Date.now() - started) / 1000);
    $("uptime").textContent = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  }, 250);

  // Schreibmaschinen-Effekt für Antworten
  let typing = null;
  function typeText(el, text) {
    clearInterval(typing); el.textContent = ""; let i = 0;
    typing = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(typing); }, 22);
  }
  function log(text) {
    const div = document.createElement("div"); div.textContent = "› " + text;
    const box = $("log"); box.prepend(div); while (box.children.length > 5) box.lastChild.remove();
  }

  // Eingabe
  $("cmd").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const text = e.target.value.trim(); if (!text) return;
    e.target.value = "";
    if (window.pywebview) window.pywebview.api.send_text(text);
    else { HUD.user(text); HUD.setState("thinking"); setTimeout(() => { HUD.jarvis("Demo-Modus: Python ist nicht verbunden."); HUD.setState("idle"); }, 1200); }
  });

  // Öffentliche Schnittstelle für Python
  return {
    setState(s) { if (!STATES[s]) return; state = s; $("state").textContent = STATES[s].label; $("mode").textContent = STATES[s].label; },
    level(v) { target = Math.max(0, Math.min(1, v)); lastLevelAt = performance.now(); },
    user(text) { $("you").textContent = "DU › " + text; log("Befehl empfangen"); },
    jarvis(text) { typeText($("say"), text); },
    tool(name) { log(name.replace(/_/g, " ")); },
    info(o) { if (o.core) $("core").textContent = o.core; if (o.voice) $("voice").textContent = o.voice; if (o.mic) $("mic").textContent = o.mic; },
    micOff(msg) { $("mic").textContent = "AUS"; if (msg) log(msg); },
  };
})();

window.addEventListener("pywebviewready", () => window.pywebview.api.ready());
</script>
</body>
</html>
